<!DOCTYPE html>
<!--
PokeSnap-Dex - A Pokémon AR Photo Collection App

Overview:
This is a web-based PokeSnap-Dex clone inspired by Pokémon GO's AR photo feature.
It displays a grid of 1025 Pokémon (Gen 1-9) with variants (base, shiny, regional, etc.).
Users can view captured Pokémon, browse galleries, and toggle themes.
UI: Sticky header/footer, responsive dex-container height, matching widths/layers.

Key Features:
- Grid view: Shows first available real image variant per Pokémon (ignores placeholders).
- Capture count: Counts only Pokémon with at least one real image (not placeholders).
- Gallery: Modal view with variant navigation (keyboard: arrows, escape).
- Responsive design: Adapts to mobile with dynamic grid sizing. Dex-container height adjusts to viewport.
- Theme toggle: Dark/light mode.
- Sticky UI: Header sticks to top, footer to bottom, both on same layer above dex-container.
- Data integrity: 1025 entries, no duplicates, proper naming.

Data Structure (data.json):
- Keys: '001' to '1025' (Pokémon numbers).
- Each entry: { name: string, variants: [{ label: string, images: [url], position: string, fit: string, entries: [string] }] }
- Placeholders: "https://your-image-url-here.jpg" for missing images.

Branches:
- main/Public: Placeholder images for public demo.
- LitoFrito: Real image URLs for personal use.

Notes for Future Development:
- Ensure capture count excludes placeholders.
- Grid/gallery use findIndex for first real image variant.
- Run tests (node test.js) for data integrity.
- Mobile: CSS grid with auto-fit and min-width.
- UI Rules: Header/footer z-index 1000, widths 100%, dex-container box-sizing border-box.
-->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokeSnap-Dex</title>
    <link rel="icon" href="favicon.png" type="image/png">
    <link rel="stylesheet" href="styles.css?v=20261102-8">
</head>
<body class="dark-mode">
    <div id="app-container">
        <div class="header-container">
            <header>
                <h1>PokeSnap-Dex</h1>
                <p>Gotta snap 'em all!</p>
                <div class="header-controls">
                    <button id="captured-count">Captured: 0</button>
                    <input type="text" id="search-input" placeholder="Search Pokémon, comma-separated...">
                    <select id="capture-filter" aria-label="Filter by capture status">
                        <option value="all">All Pokémon</option>
                        <option value="caught">Caught Only</option>
                        <option value="uncaught">Uncaught Only</option>
                    </select>
                    <button id="theme-toggle">Toggle</button>
                </div>
                <div id="power-indicator"></div>
            </header>
            <div class="divider header-divider"></div>
        </div>
        <main id="dex-container">
            <!-- Grid will be populated by JS -->
        </main>
        <div class="divider footer-divider"></div>
        <div class="footer"></div>
    </div>
    <div id="gallery" class="hidden">
        <div class="gallery-content">
            <img id="gallery-image" src="" alt="Gallery Image">
            <h2 id="gallery-name"></h2>
            <div id="first-encountered">
                <span class="dex-entry-description">First Encountered:</span>
                <span id="first-encountered-value" class="dex-entry-source">???</span>
            </div>
            <div id="dex-entry"></div>
            <p id="dex-entry-scroll-hint" class="hidden">Scroll description for more</p>
            <div class="gallery-controls">
                <div id="cry-controls">
                    <span id="cry-status" role="status" aria-live="polite"></span>
                    <span id="cry-hint" hidden>Hold Play Cry to choose a recording</span>
                </div>
                <div class="gallery-action-grid">
                    <button id="prev-variant">Prev Image</button>
                    <div class="cry-play-cell">
                        <button id="play-cry" type="button" aria-expanded="false" aria-controls="cry-version-menu" aria-label="Play cry. Hold to choose a recording." disabled>
                            <span>Play Cry</span>
                            <span class="cry-options-indicator" aria-hidden="true">▾</span>
                        </button>
                        <div id="cry-version-menu" role="group" aria-label="Choose cry recording" hidden></div>
                    </div>
                    <button id="next-variant">Next Image</button>
                    <button id="prev-description">Prev Entry</button>
                    <button id="spoiler-toggle">Show Spoilers</button>
                    <button id="next-description">Next Entry</button>
                    <button id="prev-pokemon" type="button" aria-label="Previous Pokémon">← Prev Pokémon</button>
                    <button id="close-gallery">Close</button>
                    <button id="next-pokemon" type="button" aria-label="Next Pokémon">Next Pokémon →</button>
                </div>
            </div>
        </div>
    </div>
    <div id="captured-modal" class="modal">
        <div class="modal-content">
            <span id="close-captured-modal" class="close">&times;</span>
            <h2>Captured Pokémon</h2>
            <button id="toggle-show-all">Show All</button>
            <div id="captured-list"></div>
        </div>
    </div>
    <script src="dex-navigation-utils.js?v=20261101-1"></script>
    <script src="dex-entry-utils.js?v=20261102-1"></script>
    <script src="first-encountered-utils.js?v=20261102-1"></script>
    <script src="pokemon-cry-utils.js?v=20261101-1"></script>
    <script src="script.js?v=20261102-3"></script>
</body>
</html>
